<!-- Gerado por tool/site/build.sh: aviso de página ainda em inglês. -->
<style>
  #aviso-traducao { display: none; margin: 0; padding: 10px 16px; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    border-bottom: 1px solid #d4a72c; background: #fff8c5; color: #3b2f00; text-align: center; }
  #aviso-traducao a { color: #0b4f9c; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    #aviso-traducao { background: #3b3214; border-color: #9a7b1f; color: #f5e7b5; }
    #aviso-traducao a { color: #8cc4ff; }
  }
</style>
<div id="aviso-traducao" role="note"></div>
<script>
  (function () {
    var EM_INGLES = __EM_INGLES__;
    var REPO = 'https://github.com/documentacao-dev/swift-book-brasil/blob/main/';
    var ultimo = null;
    function atualizar() {
      var caminho = location.pathname;
      if (caminho === ultimo) return;
      ultimo = caminho;
      var m = caminho.match(/\/documentation\/the-swift-programming-language\/([^\/]+)/);
      var arquivo = m && EM_INGLES[m[1].toLowerCase()];
      var aviso = document.getElementById('aviso-traducao');
      if (!aviso) return;
      if (arquivo) {
        aviso.innerHTML = '<strong>Esta página ainda está em inglês.</strong> A tradução para o português ainda não chegou aqui. Quer ajudar? <a href="' + REPO + arquivo + '">Traduza no GitHub →</a>';
        aviso.style.display = 'block';
      } else {
        aviso.style.display = 'none';
      }
    }
    atualizar();
    setInterval(atualizar, 400);
  })();
</script>
